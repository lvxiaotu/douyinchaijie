<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1660" role="img" aria-label="AI 视频拆解逻辑示意图">
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.45"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#34d399"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#fbbf24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif;
        letter-spacing: 0;
      }
      .title {
        fill: #f8fafc;
        font-size: 28px;
        font-weight: 700;
      }
      .subtitle {
        fill: #94a3b8;
        font-size: 12px;
        font-weight: 500;
      }
      .phase-label {
        fill: #fbbf24;
        font-size: 12px;
        font-weight: 700;
      }
      .box-title {
        fill: #f8fafc;
        font-size: 17px;
        font-weight: 700;
      }
      .box-sub {
        fill: #cbd5e1;
        font-size: 11px;
        font-weight: 500;
      }
      .legend-label {
        fill: #cbd5e1;
        font-size: 11px;
        font-weight: 600;
      }
      .arrow-label {
        fill: #e2e8f0;
        font-size: 10px;
        font-weight: 700;
      }
      .boundary {
        fill: none;
        stroke: #334155;
        stroke-width: 1.2;
        stroke-dasharray: 8 5;
      }
      .box-frontend { fill: rgba(8, 51, 68, 0.96); stroke: #22d3ee; }
      .box-backend { fill: rgba(6, 78, 59, 0.96); stroke: #34d399; }
      .box-queue { fill: rgba(7, 89, 133, 0.96); stroke: #38bdf8; }
      .box-external { fill: rgba(120, 53, 15, 0.95); stroke: #fbbf24; }
      .box-process { fill: rgba(15, 23, 42, 0.98); stroke: #60a5fa; }
      .box-ai { fill: rgba(30, 41, 59, 0.98); stroke: #93c5fd; }
      .box-storage { fill: rgba(76, 29, 149, 0.95); stroke: #a78bfa; }
      .box-final { fill: rgba(15, 23, 42, 0.98); stroke: #8b5cf6; }
      .connector { fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .connector-muted { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .chip { rx: 8; ry: 8; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="60" y="44" class="title">AI 视频拆解逻辑示意图</text>
  <text x="60" y="68" class="subtitle">任务进入后，系统先控并发，再做素材采集、音画预处理、分段多模态拆解，最后把结果落到分析库和前端结果页。</text>

  <g transform="translate(1210 24)">
    <rect x="0" y="0" width="128" height="28" rx="8" class="chip" fill="#083344" stroke="#22d3ee"/>
    <text x="64" y="18" text-anchor="middle" class="legend-label">前端 / 输入</text>
    <rect x="138" y="0" width="128" height="28" rx="8" class="chip" fill="#064e3b" stroke="#34d399"/>
    <text x="202" y="18" text-anchor="middle" class="legend-label">后端 / 调度</text>
    <rect x="276" y="0" width="128" height="28" rx="8" class="chip" fill="#1e293b" stroke="#60a5fa"/>
    <text x="340" y="18" text-anchor="middle" class="legend-label">AI / 拆解</text>
    <rect x="414" y="0" width="128" height="28" rx="8" class="chip" fill="#4c1d95" stroke="#a78bfa"/>
    <text x="478" y="18" text-anchor="middle" class="legend-label">存储 / 结果</text>
  </g>

  <rect x="60" y="100" width="1580" height="250" class="boundary"/>
  <text x="78" y="122" class="phase-label">Phase 1 任务入口与调度</text>

  <rect x="60" y="370" width="1580" height="330" class="boundary"/>
  <text x="78" y="392" class="phase-label">Phase 2 素材获取与本地视频判断</text>

  <rect x="60" y="720" width="1580" height="270" class="boundary"/>
  <text x="78" y="742" class="phase-label">Phase 3 音画预处理与语义切片</text>

  <rect x="60" y="1010" width="1580" height="590" class="boundary"/>
  <text x="78" y="1032" class="phase-label">Phase 4 多模态拆解、全局总结与落库</text>

  <!-- Phase 1 -->
  <g filter="url(#shadow)">
    <rect x="130" y="154" width="260" height="76" rx="14" class="box-frontend"/>
    <text x="260" y="185" text-anchor="middle" class="box-title">
      <tspan x="260" dy="0">前端发起任务</tspan>
      <tspan x="260" dy="20" class="box-sub">提交视频地址 / 采集参数 / 赛道信息</tspan>
    </text>

    <rect x="470" y="154" width="320" height="76" rx="14" class="box-backend"/>
    <text x="630" y="185" text-anchor="middle" class="box-title">
      <tspan x="630" dy="0">后端接收并建任务</tspan>
      <tspan x="630" dy="20" class="box-sub">创建 task、写入任务库、回传任务 ID</tspan>
    </text>

    <rect x="900" y="146" width="300" height="92" rx="14" class="box-queue"/>
    <text x="1050" y="176" text-anchor="middle" class="box-title">
      <tspan x="1050" dy="0">AI 视频队列 / worker</tspan>
      <tspan x="1050" dy="20" class="box-sub">并发信号量上限 3 / 心跳 / 重试 / 取消</tspan>
    </text>
  </g>

  <line x1="390" y1="192" x2="470" y2="192" class="connector" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
  <line x1="790" y1="192" x2="900" y2="192" class="connector" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
  <line x1="1050" y1="238" x2="1050" y2="312" class="connector" stroke="#38bdf8" marker-end="url(#arrow-blue)"/>

  <!-- Phase 2 decision -->
  <g filter="url(#shadow)">
    <polygon points="850,396 920,440 850,484 780,440" class="box-external"/>
    <text x="850" y="431" text-anchor="middle" class="box-title">
      <tspan x="850" dy="0">本地是否已有</tspan>
      <tspan x="850" dy="20">可用视频缓存？</tspan>
    </text>

    <rect x="410" y="552" width="300" height="76" rx="14" class="box-backend"/>
    <text x="560" y="583" text-anchor="middle" class="box-title">
      <tspan x="560" dy="0">使用本地缓存视频</tspan>
      <tspan x="560" dy="20" class="box-sub">直接进入预处理，不重复下载</tspan>
    </text>

    <rect x="990" y="552" width="340" height="76" rx="14" class="box-external"/>
    <text x="1160" y="583" text-anchor="middle" class="box-title">
      <tspan x="1160" dy="0">第三方去水印 API</tspan>
      <tspan x="1160" dy="20" class="box-sub">下载到本地缓存，作为后续 ffmpeg 输入</tspan>
    </text>
  </g>

  <path d="M 850 484 L 760 520 L 560 552" class="connector" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
  <path d="M 850 484 L 940 520 L 1160 552" class="connector" stroke="#fbbf24" marker-end="url(#arrow-amber)"/>
  <text x="718" y="512" class="arrow-label">是</text>
  <text x="984" y="512" class="arrow-label">否</text>

  <path d="M 560 628 L 560 668 L 850 668 L 850 704" class="connector" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
  <path d="M 1160 628 L 1160 668 L 850 668 L 850 704" class="connector" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>

  <!-- Phase 3 -->
  <g filter="url(#shadow)">
    <rect x="410" y="722" width="880" height="84" rx="14" class="box-process"/>
    <text x="850" y="754" text-anchor="middle" class="box-title">
      <tspan x="850" dy="0">ffmpeg 预处理</tspan>
      <tspan x="850" dy="20" class="box-sub">抽取 16kHz wav + mpdecimate 去重抽帧 + 关键帧网格，变化率阈值可配置</tspan>
    </text>

    <rect x="410" y="842" width="880" height="84" rx="14" class="box-ai"/>
    <text x="850" y="874" text-anchor="middle" class="box-title">
      <tspan x="850" dy="0">豆包录音文件识别 2.0</tspan>
      <tspan x="850" dy="20" class="box-sub">Word Timestamps / Pause Points，音频可走 TOS 或公网 URL</tspan>
    </text>

    <rect x="410" y="962" width="880" height="84" rx="14" class="box-process"/>
    <text x="850" y="994" text-anchor="middle" class="box-title">
      <tspan x="850" dy="0">动态语义切片</tspan>
      <tspan x="850" dy="20" class="box-sub">按停顿点找句子边界，平滑切段，不再死板 90 秒</tspan>
    </text>
  </g>

  <line x1="850" y1="704" x2="850" y2="722" class="connector" stroke="#60a5fa" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="806" x2="850" y2="842" class="connector" stroke="#60a5fa" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="926" x2="850" y2="962" class="connector" stroke="#60a5fa" marker-end="url(#arrow-blue)"/>

  <!-- Phase 4 -->
  <g filter="url(#shadow)">
    <rect x="370" y="1062" width="960" height="82" rx="14" class="box-process"/>
    <text x="850" y="1093" text-anchor="middle" class="box-title">
      <tspan x="850" dy="0">组装 Evidence JSON</tspan>
      <tspan x="850" dy="20" class="box-sub">视频元数据 + 分段文本 + 关键帧网格 + 定量 / 定性指标</tspan>
    </text>

    <rect x="370" y="1178" width="960" height="82" rx="14" class="box-ai"/>
    <text x="850" y="1209" text-anchor="middle" class="box-title">
      <tspan x="850" dy="0">Gemini 2.5 Flash（云雾中转）</tspan>
      <tspan x="850" dy="20" class="box-sub">分段投喂“文本 + 网格图”，拆局部视觉 / 听觉钩子</tspan>
    </text>

    <rect x="370" y="1294" width="960" height="82" rx="14" class="box-ai"/>
    <text x="850" y="1325" text-anchor="middle" class="box-title">
      <tspan x="850" dy="0">DeepSeek-V3 / R1（官方）</tspan>
      <tspan x="850" dy="20" class="box-sub">全局总结爆款公式、文案心理、视觉模板与复刻脚本</tspan>
    </text>

    <rect x="270" y="1410" width="1160" height="104" rx="14" class="box-final"/>
    <text x="850" y="1442" text-anchor="middle" class="box-title">
      <tspan x="850" dy="0">输出拆解报告 + 前端结果页</tspan>
      <tspan x="850" dy="20" class="box-sub">雷达图 / 多模态时间线 / 评论洞察 / 复刻实验室</tspan>
      <tspan x="850" dy="18" class="box-sub">同时写入分析库、目标库和 remake exports，便于后续数据分析</tspan>
    </text>
  </g>

  <line x1="850" y1="1144" x2="850" y2="1178" class="connector" stroke="#60a5fa" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="1260" x2="850" y2="1294" class="connector" stroke="#60a5fa" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="1376" x2="850" y2="1410" class="connector" stroke="#8b5cf6" marker-end="url(#arrow-violet)"/>

  <!-- Storage sinks -->
  <g filter="url(#shadow)">
    <g transform="translate(220 1546)">
      <rect x="0" y="12" width="360" height="48" rx="2" class="box-storage"/>
      <ellipse cx="180" cy="12" rx="180" ry="12" class="box-storage"/>
      <ellipse cx="180" cy="60" rx="180" ry="12" class="box-storage"/>
      <line x1="0" y1="12" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.4"/>
      <line x1="360" y1="12" x2="360" y2="60" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="180" y="38" text-anchor="middle" class="box-title" font-size="15">short_video_analysis_db</text>
      <text x="180" y="56" text-anchor="middle" class="box-sub">analysis_runs / segments / formulas / remake_exports</text>
    </g>

    <g transform="translate(1090 1546)">
      <rect x="0" y="12" width="360" height="48" rx="2" class="box-storage"/>
      <ellipse cx="180" cy="12" rx="180" ry="12" class="box-storage"/>
      <ellipse cx="180" cy="60" rx="180" ry="12" class="box-storage"/>
      <line x1="0" y1="12" x2="0" y2="60" stroke="#a78bfa" stroke-width="1.4"/>
      <line x1="360" y1="12" x2="360" y2="60" stroke="#a78bfa" stroke-width="1.4"/>
      <text x="180" y="38" text-anchor="middle" class="box-title" font-size="15">tiktok_target_db</text>
      <text x="180" y="56" text-anchor="middle" class="box-sub">视频元数据 / 指标 / 评论快照 / 互动画像</text>
    </g>
  </g>

  <path d="M 850 1514 L 760 1540 L 580 1568" class="connector-muted" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>
  <path d="M 850 1514 L 940 1540 L 1090 1568" class="connector-muted" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>

  <text x="60" y="1648" class="subtitle">核心一句话：先把视频和评论证据做成结构化数据，再让段级多模态模型抓手法，最后由全局模型抽公式并把结果回写到库和 UI。</text>
</svg>
